; AITL — AI In The Loop · Caeruli Obscuri Laboratorium
; Target: 2.8" capacitive "CYD" (ESP32-D0WD-V3, 4MB flash, ST7789 240x320, CST820 touch)
;
;   pio run -e cyd28c -t upload   ; this unit (2.8" capacitive). Other boards: see boards/README.md
;
[platformio]
default_envs = cyd28c

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -DCORE_DEBUG_LEVEL=1
  -DAITL_FW_VERSION=\"0.2.0\"
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
lib_deps =
  lvgl/lvgl@8.3.11
  lovyan03/LovyanGFX@1.1.16
  bblanchon/ArduinoJson@7.2.1
  h2zero/NimBLE-Arduino@2.3.4
  links2004/WebSockets@2.6.1

[env:cyd28c]
build_flags = ${env.build_flags} -DAITL_BOARD_CYD28C=1

[env:cyd28c_st7789]
build_flags = ${env.build_flags} -DAITL_BOARD_CYD28C=1 -DAITL_PANEL_ST7789=1

[env:cyd28r]
build_flags = ${env.build_flags} -DAITL_BOARD_CYD28R=1

[env:cyd24c]
build_flags = ${env.build_flags} -DAITL_BOARD_CYD24C=1

[env:cyd35r]
build_flags = ${env.build_flags} -DAITL_BOARD_CYD35R=1

[env:hosyond40r]
build_flags = ${env.build_flags} -DAITL_BOARD_HOSYOND40R=1
